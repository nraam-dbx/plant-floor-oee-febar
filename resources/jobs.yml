resources:
  jobs:
    plant_oee_build:
      name: plant_oee_build
      description: Land synthetic IT + OT extracts, refresh the Lakeflow medallion pipeline, retrain + score the at-risk model,
        GenAI root cause. All serverless (the workspace allows serverless compute only).
      tasks:
        - task_key: generate_data
          notebook_task:
            notebook_path: ../data_generation/generate_plant_data.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        - task_key: refresh_pipeline
          depends_on: [{task_key: generate_data}]
          pipeline_task:
            pipeline_id: ${resources.pipelines.plant_oee_pipeline.id}
            full_refresh: true
        - task_key: train_at_risk_model
          depends_on: [{task_key: refresh_pipeline}]
          max_retries: 0
          notebook_task:
            notebook_path: ../notebooks/10_train_oee_at_risk.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        - task_key: genai_root_cause
          depends_on: [{task_key: train_at_risk_model}]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../notebooks/11_genai_root_cause.sql
        - task_key: refresh_lakebase_sync
          depends_on: [{task_key: genai_root_cause}]
          notebook_task:
            notebook_path: ../lakebase/refresh_synced_tables.py

    plant_oee_lakebase_setup:
      name: plant_oee_lakebase_setup
      description: Create the writable ops schema in Lakebase Postgres, smoke-test read + write, (re)create views over the reverse-synced change feed.
        Run ops/lakebase_reverse_sync.sh once after the first run (creates the CDF config).
      tasks:
        - task_key: setup_ops_tables
          notebook_task:
            notebook_path: ../lakebase/setup_ops_tables.py
        - task_key: reverse_sync_views
          depends_on: [{task_key: setup_ops_tables}]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../lakebase/02_reverse_sync_views.sql

    plant_oee_agent_eval:
      name: plant_oee_agent_eval
      description: Evaluate the Plant-Floor OEE Supervisor agent with MLflow LLM judges + a tool-routing scorer.
      tasks:
        - task_key: eval_supervisor
          max_retries: 0
          notebook_task:
            notebook_path: ../notebooks/20_eval_supervisor.py
