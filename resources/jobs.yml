resources:
  jobs:
    plant_oee_build:
      name: plant_oee_build
      description: Land synthetic IT + OT extracts, then refresh the Lakeflow medallion pipeline.
      tasks:
        - task_key: generate_data
          notebook_task:
            notebook_path: ../data_generation/generate_plant_data.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        - task_key: refresh_pipeline
          depends_on: [{task_key: generate_data}]
          pipeline_task:
            pipeline_id: ${resources.pipelines.plant_oee_pipeline.id}
            full_refresh: true
